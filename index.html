<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOP 10 Vinhos Portugueses — Цены и Скидки</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              wine: {
                50: '#fdf2f4',
                100: '#fbe5ea',
                800: '#5c061e',
                900: '#3d0312',
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-stone-50 text-stone-800 font-sans antialiased">
    <!-- HERO SECTION -->
    <header
      class="bg-gradient-to-r from-wine-900 to-wine-800 text-white py-16 px-4 text-center shadow-lg"
    >
      <div class="max-w-4xl mx-auto">
        <span
          class="bg-wine-100 text-wine-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider"
        >
          Эксклюзивный чарт
        </span>
        <h1 class="text-4xl md:text-5xl font-extrabold mt-4 tracking-tight">
          ТОП-10 португальских вин
        </h1>
        <p class="text-stone-300 mt-3 text-lg md:text-xl font-light">
          Актуальный рейтинг победителей Essência do Vinho со сравнением цен в
          магазинах Португалии.
        </p>
        <div
          class="mt-6 inline-flex items-center gap-2 bg-black/30 text-stone-200 text-sm px-4 py-2 rounded-lg border border-white/10"
        >
          <span
            class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"
          ></span>
          <span
            >Цены обновлены:
            <strong id="update-time" class="text-white"
              >загрузка...</strong
            ></span
          >
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto px-4 py-12">
      <div id="wines-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Сюда JS вставит карточки вин -->
      </div>
    </main>

    <footer
      class="bg-stone-900 text-stone-500 py-8 text-center text-xs border-t border-stone-800 mt-12"
    >
      <p>© 2026 Svyatik Monitoring Engine. Все права защищены.</p>
    </footer>

    <!-- Скрипт для загрузки данных -->
    <script>
      async function loadWines() {
        try {
          const response = await fetch('wines.json');
          const data = await response.json();

          const updateDate = new Date(data.updatedAt);
          const formattedTime =
            updateDate.toLocaleDateString('ru-RU') +
            ' в ' +
            updateDate.toLocaleTimeString('ru-RU', {
              hour: '2-digit',
              minute: '2-digit',
            });
          document.getElementById('update-time').innerText = formattedTime;

          const grid = document.getElementById('wines-grid');
          grid.innerHTML = '';

          data.wines.forEach((wine) => {
            const card = `
            <div class="bg-white rounded-2xl shadow-sm border border-stone-200/80 overflow-hidden hover:shadow-md transition-shadow flex flex-col justify-between">
              <!-- Блок контента с flex-рядом для картинки -->
              <div class="p-6 flex gap-5 items-start">
                
                <!-- Контейнер изображения (выводится, если есть URL) -->
                ${
                  wine.imageUrl
                    ? `
                <div class="w-20 h-28 shrink-0 flex items-center justify-center bg-stone-50 rounded-xl p-1.5 border border-stone-100">
                  <img src="${wine.imageUrl}" alt="${wine.name}" class="max-h-full max-w-full object-contain">
                </div>
                `
                    : `
                <div class="w-20 h-28 shrink-0 flex items-center justify-center bg-stone-100 rounded-xl border border-stone-200 text-stone-400 text-xs text-center p-1">
                  Нет фото
                </div>
                `
                }

                <!-- Текстовое описание -->
                <div class="flex-1 min-w-0">
                  <div class="flex justify-between items-start gap-2">
                    <span class="text-stone-400 text-xs font-semibold tracking-wider uppercase truncate block">
                      ${wine.category} (${wine.categoryPlace})
                    </span>
                    <span class="bg-wine-800 text-white text-sm font-bold w-7 h-7 flex items-center justify-center rounded-full shrink-0">
                      ${wine.overallPlace}
                    </span>
                  </div>
                  <h3 class="text-lg font-bold text-wine-900 mt-1 leading-snug break-words">${wine.name}</h3>
                  <p class="text-sm text-stone-500 mt-1">Регион: ${wine.producerRegion}</p>
                  ${wine.enologist ? `<p class="text-xs italic text-stone-400 mt-1.5">Энолог: ${wine.enologist}</p>` : ''}
                </div>
              </div>
              
              <!-- Подвал карточки с ценой и кнопкой -->
              <div class="bg-stone-50 px-6 py-4 border-t border-stone-100 flex items-center justify-between">
                <div>
                  <span class="text-xs text-stone-400 block uppercase font-medium">Цена в Португалии</span>
                  <span class="text-2xl font-black text-wine-800">€${wine.price}</span>
                </div>
                <a href="${wine.buyUrl}" target="_blank" class="bg-wine-800 hover:bg-wine-900 text-white font-semibold px-5 py-2.5 rounded-xl transition-colors text-sm shadow-sm">
                  Купить вино
                </a>
              </div>
            </div>
          `;
            grid.innerHTML += card;
          });
        } catch (error) {
          console.error('Ошибка загрузки вин:', error);
          document.getElementById('wines-grid').innerHTML =
            '<p class="text-red-500 text-center col-span-2">Не удалось загрузить актуальные цены. Попробуйте позже.</p>';
        }
      }

      loadWines();
    </script>
  </body>
</html>
